# Disable JPA/MySQL autoconfiguration
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# MongoDB connection
spring.data.mongodb.uri=mongodb://localhost:27017/smartcampus
spring.data.mongodb.database=smartcampus

# Server
server.port=8080

# MongoDB timeouts
spring.data.mongodb.connect-timeout=500
spring.data.mongodb.socket-timeout=500
spring.data.mongodb.server-selection-timeout=500

# File Upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
