spring.application.name=backend
spring.application.name=backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus_db
spring.datasource.username=root
spring.datasource.password=yourpassword

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# MongoDB
# spring.data.mongodb.uri=mongodb://localhost:27017/incident_db
spring.data.mongodb.connect-timeout=500
spring.data.mongodb.socket-timeout=500
spring.data.mongodb.server-selection-timeout=500

# File Upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB